<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MataForge 编辑器</title>
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <header>
    <h1>MataForge 项目管理器</h1>
    <div class="actions">
      <button id="settingsBtn">全局设置</button>
      <button id="exportBtn">导出全部</button>
      <button id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json" hidden />
      <button id="newBtn">＋ 新建项目</button>
      <button id="buildBtn">生成网站</button>
      <button id="commitBtn">提交代码</button>
      <button id="publishBtn" class="primary">上传 GitHub</button>
      <a id="previewLink" href="/preview" target="_blank">预览</a>
    </div>
  </header>
  <main>
    <aside id="sidebar">
      <input id="search" type="search" placeholder="搜索项目..." />
      <div class="status-filter" id="statusFilter">
        <button type="button" data-status="all" class="active">全部</button>
        <button type="button" data-status="production">生产</button>
        <button type="button" data-status="test">测试</button>
        <button type="button" data-status="dev">开发</button>
      </div>
      <div id="list"></div>
    </aside>
    <section id="editor">
      <div id="empty">← 选择或新建一个项目</div>
      <form id="form" hidden></form>
    </section>
    <aside id="previewPane" class="preview-pane">
      <h2>实时预览</h2>
      <div id="previewCard"></div>
    </aside>
  </main>
  <div id="toast"></div>
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>全局设置</h2>
        <button id="closeSettings" type="button">×</button>
      </div>
      <div id="settingsForm"></div>
      <div class="shared-section">
        <h3>公共资源</h3>
        <p class="shared-tip">这里可上传任意类型资源（图标、字体、音频、脚本、数据等），作为公共服务复制到输出目录的 shared/ 文件夹，供所有项目引用。</p>
        <input type="file" id="sharedFile" multiple hidden />
        <div class="shared-upload-row">
          <input type="text" id="sharedSubdir" placeholder="子目录（可选，如 fonts、audio）" />
          <button id="uploadSharedBtn" type="button">上传资源</button>
          <button id="openSharedDirBtn" type="button" title="在系统文件管理器中打开 shared/ 目录，适合直接放入大型资源">打开本地目录</button>
        </div>
        <div class="shared-toolbar" id="sharedToolbar" hidden>
          <label><input type="checkbox" id="sharedSelectAll" /> 全选</label>
          <button id="deleteSharedSelected" type="button" class="danger">删除选中</button>
        </div>
        <ul id="sharedList"></ul>
      </div>
    </div>
  </div>
  <script type="module" src="./editor.js"></script>
</body>
</html>
